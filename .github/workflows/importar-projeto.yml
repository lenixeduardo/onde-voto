name: Importar código-fonte Onde Voto
on:
  push:
    paths:
      - infra/source.tar.gz.b64
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extrair pacote de código-fonte
        run: |
          mkdir -p /tmp/onde-voto-source
          base64 -d infra/source.tar.gz.b64 | tar xzf - -C /tmp/onde-voto-source
          cp -a /tmp/onde-voto-source/. .
          rm -rf infra
      - name: Registrar código e assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: publica landing page, API, testes e assets v1.1.0"
            git push origin HEAD:main
          fi
